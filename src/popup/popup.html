<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="logo">📖</span>
      <div>
        <div class="name">小说悦读</div>
        <div class="sub" id="pageStatus">检测当前页面…</div>
      </div>
    </div>

    <button id="openReader" class="primary">进入阅读模式 <span class="kbd">Alt+R</span></button>

    <div class="section-title">最近阅读</div>
    <div id="recentList" class="recent"><div class="recent-empty">读取中…</div></div>

    <div class="group">
      <label class="row">
        <span>显示悬浮阅读按钮</span>
        <input type="checkbox" id="floatingButton" />
      </label>
      <label class="row">
        <span>全局拦截广告域名</span>
        <input type="checkbox" id="globalAdBlock" />
      </label>
      <label class="row">
        <span>在此站点启用</span>
        <input type="checkbox" id="siteEnabled" />
      </label>
    </div>

    <div class="foot">
      快捷键：Alt+R 进入/退出 · ← → 翻章 · + − 字号 · Esc 退出<br />
      阅读时自动按站点屏蔽广告域名，重排页面天然去除广告与图片。
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
